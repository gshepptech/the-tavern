<svg xmlns="http://www.w3.org/2000/svg" width="760" height="562" viewBox="0 0 760 562" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
  <rect x="1" y="1" width="758" height="560" rx="10" fill="#0d1117" stroke="#30363d"/>
  <rect x="1" y="1" width="758" height="40" rx="10" fill="#161b22"/>
  <rect x="1" y="31" width="758" height="10" fill="#161b22"/>
  <circle cx="24" cy="21" r="6" fill="#ff5f56"/>
  <circle cx="44" cy="21" r="6" fill="#ffbd2e"/>
  <circle cx="64" cy="21" r="6" fill="#27c93f"/>
  <text x="380" y="26" text-anchor="middle" fill="#8b949e">the-tavern — verify</text>

  <!-- guard demo: real verdicts from guard-git.py against an armed Ranger run -->
  <text x="24" y="76" fill="#8b949e"># an unattended Ranger run is armed. its guard, on every command:</text>

  <text x="40" y="108" fill="#e6edf3">git commit -m 'fix'</text>
  <text x="620" y="108" fill="#3fb950">allow</text>
  <text x="40" y="134" fill="#e6edf3">npm test</text>
  <text x="620" y="134" fill="#3fb950">allow</text>
  <text x="40" y="160" fill="#e6edf3">git push origin main</text>
  <text x="620" y="160" fill="#f85149">deny</text>
  <text x="40" y="186" fill="#e6edf3">sh -c &quot;git push&quot;</text>
  <text x="620" y="186" fill="#f85149">deny</text>
  <text x="40" y="212" fill="#e6edf3">gh api -X POST /repos/o/r/git/refs</text>
  <text x="620" y="212" fill="#f85149">deny</text>
  <text x="40" y="238" fill="#e6edf3">git clean -fdX</text>
  <text x="620" y="238" fill="#f85149">deny</text>

  <text x="24" y="272" fill="#8b949e"># it commits locally and cannot publish, even under bypassed permissions.</text>

  <line x1="24" y1="296" x2="736" y2="296" stroke="#21262d"/>

  <!-- real test + check results -->
  <text x="24" y="332" fill="#8b949e"># the five test suites and the CI consistency checks:</text>

  <text x="40" y="364" fill="#c9d1d9">warden</text>
  <text x="180" y="364" fill="#3fb950">19 passed</text>
  <text x="40" y="390" fill="#c9d1d9">sage</text>
  <text x="180" y="390" fill="#3fb950">42 passed</text>
  <text x="40" y="416" fill="#c9d1d9">ranger</text>
  <text x="180" y="416" fill="#3fb950">118 passed</text>
  <text x="40" y="442" fill="#c9d1d9">smith</text>
  <text x="180" y="442" fill="#3fb950">43 passed</text>
  <text x="40" y="468" fill="#c9d1d9">tinker</text>
  <text x="180" y="468" fill="#3fb950">119 passed</text>

  <text x="40" y="506" fill="#e6edf3">341 passed</text>
  <text x="180" y="506" fill="#c9d1d9">manifests · versions · docs · flags · profiles</text>
  <text x="640" y="506" fill="#3fb950">all green</text>

  <text x="24" y="542" fill="#484f58" font-size="12">actual output — guard-git.py and the plugin test suites, this repository</text>
</svg>
