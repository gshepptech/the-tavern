<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-label="The Tavern — ten Claude Code plugins">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="0.55" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.12" cy="0.1" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="200" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="200" rx="20" fill="url(#glow)"/>

  <!-- 10-tile plugin grid mark (2 rows x 5) -->
  <g transform="translate(52,58)" fill="#ffffff">
    <rect x="0" y="0" width="15" height="19" rx="3.5" opacity="0.95"/>
    <rect x="20" y="0" width="15" height="19" rx="3.5" opacity="0.78"/>
    <rect x="40" y="0" width="15" height="19" rx="3.5" opacity="0.78"/>
    <rect x="60" y="0" width="15" height="19" rx="3.5" opacity="0.62"/>
    <rect x="80" y="0" width="15" height="19" rx="3.5" opacity="0.62"/>
    <rect x="0" y="25" width="15" height="19" rx="3.5" opacity="0.78"/>
    <rect x="20" y="25" width="15" height="19" rx="3.5" opacity="0.62"/>
    <rect x="40" y="25" width="15" height="19" rx="3.5" opacity="0.62"/>
    <rect x="60" y="25" width="15" height="19" rx="3.5" opacity="0.5"/>
    <rect x="80" y="25" width="15" height="19" rx="3.5" opacity="0.5"/>
  </g>

  <text x="166" y="86" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" fill="#ffffff" letter-spacing="-1">The Tavern</text>
  <text x="168" y="124" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#ffffff" opacity="0.97">Sage draws it. Smith builds it. Warden keeps Claude honest.</text>
  <rect x="168" y="142" width="472" height="28" rx="14" fill="#ffffff" opacity="0.16"/>
  <text x="184" y="161" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#ffffff" opacity="0.95">Ten Claude Code plugins · spec → build → verify → ship</text>
</svg>
