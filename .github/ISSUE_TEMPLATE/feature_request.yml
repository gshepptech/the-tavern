name: Feature request
description: Suggest an improvement or a new regular for the tavern
title: "[feat]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Have an idea that would make one of the regulars better? Describe it below.
  - type: dropdown
    id: plugin
    attributes:
      label: Which regular (or a new one)?
      options:
        - sage
        - smith
        - tinker
        - squire
        - sellsword
        - ranger
        - warden
        - seer
        - cleric
        - scout
        - bard
        - tactician
        - scribe
        - raven
        - monk
        - a new plugin
        - the marketplace itself
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the pain, not just the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
